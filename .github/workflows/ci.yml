# Type-checks and builds on every pull request so broken content or code
# never reaches main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
