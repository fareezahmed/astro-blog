# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme to build with (nova, atlas, paper, pop, fern)'
        default: nova

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Project sites live at https://<owner>.github.io/<repo>/, so the
          # build needs both the origin and the sub-path.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          WP_API_URL: https://public-api.wordpress.com/wp/v2/sites/en.blog.wordpress.com
          SITE_THEME: ${{ inputs.theme || 'nova' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
